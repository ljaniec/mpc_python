[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mpc-python"
version = "0.1.0"
description = "Model Predictive Control for path-following problems"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "matplotlib",
    "cvxpy",
    "scipy",
    "osqp",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["mpc_python"]
